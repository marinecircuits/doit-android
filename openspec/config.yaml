schema: spec-driven

context: |
  doit is a personal Android client for one self-hosted Vikunja server (2.4 or newer). Use API v2 (/api/v2) only; v1 is frozen upstream.
  Authentication is by Vikunja API token (tk_...) only. Password, OIDC and OAuth logins are out of scope unless a change adds them explicitly.
  The developer machine has no JDK or Android SDK: every build, test and release runs on GitHub Actions.
  The GitHub repo (marinecircuits/doit) must stay private.
  Releases follow the marinecircuits Commitizen pattern: a manual "Prepare Release" workflow opens a release/X.Y.Z pull request, and merging it runs "Publish Release". Commit messages must be Conventional Commits.
  Release APKs are signed with the shared marinecircuits Android key from the organization secrets ANDROID_SIGNING_*.

