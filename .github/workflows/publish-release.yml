name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: pip install -r requirements-release.txt

      - name: Validate version and release PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(cz version --project)
          test "$PR_TITLE" = "Release $VERSION"
          test "$PR_BRANCH" = "release/$VERSION"
          grep -qx "doit.versionName=$VERSION" gradle.properties
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The signed APK was built from this commit by Build. R8 is the slow part, so it is not repeated here.
      # A pull_request Build on the release branch often fails before it starts. That must not
      # cancel publishing while the workflow_dispatch Build is still signing.
      - name: Wait for the signed build
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess, sys, time
          sha = os.environ["HEAD_SHA"]
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"short_sha={sha[:7]}\n")

          def runs():
              raw = subprocess.check_output(
                  [
                      "gh", "run", "list", "--workflow", "build.yml", "--commit", sha,
                      "--limit", "20", "--json", "databaseId,conclusion,event,status",
                  ],
                  text=True,
              )
              return json.loads(raw)

          for attempt in range(1, 41):
              found = runs()
              dispatch = [run for run in found if run["event"] == "workflow_dispatch"]
              pull_requests = [run for run in found if run["event"] == "pull_request"]
              chosen = next((run for run in dispatch if run.get("conclusion") == "success"), None)
              if chosen is None:
                  chosen = next((run for run in pull_requests if run.get("conclusion") == "success"), None)
              if chosen is not None:
                  with open(output, "a", encoding="utf-8") as handle:
                      handle.write(f"run_id={chosen['databaseId']}\n")
                  sys.exit(0)
              if any(run.get("conclusion") == "failure" for run in dispatch):
                  print(f"::error::The signed build for {sha} failed", flush=True)
                  for run in found:
                      print(run["databaseId"], run["event"], run.get("status"), run.get("conclusion"), flush=True)
                  sys.exit(1)
              print(f"Signed build for {sha} is not ready (attempt {attempt})", flush=True)
              time.sleep(15)
          print(f"::error::Timed out waiting for the signed build of {sha}", flush=True)
          for run in runs():
              print(run["databaseId"], run["event"], run.get("status"), run.get("conclusion"), flush=True)
          sys.exit(1)
          PY

      - uses: actions/download-artifact@v7
        with:
          name: doit-release-${{ steps.signed.outputs.short_sha }}
          run-id: ${{ steps.signed.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the APK is signed with the marinecircuits key
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mv "doit-release-${{ steps.signed.outputs.short_sha }}.apk" "doit-$VERSION.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "doit-$VERSION.apk" | tee signer.txt
          grep -q "SHA-256 digest: 064157c95274c36e68ee488d4102616aba074e847c3ff2ed63ed1a92c5400b09" signer.txt

      - name: Tag tested merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Release notes
        run: cz changelog "$VERSION" --dry-run > release_notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --title "Release $VERSION" \
              --notes-file release_notes.md --verify-tag
          fi
          gh release upload "$VERSION" "doit-$VERSION.apk" --clobber
