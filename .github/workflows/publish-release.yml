name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Commitizen
        run: pip install -r requirements-release.txt

      - name: Validate version and release PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(cz version --project)
          test "$PR_TITLE" = "Release $VERSION"
          test "$PR_BRANCH" = "release/$VERSION"
          grep -qx "doit.versionName=$VERSION" gradle.properties
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The signed APK was built from this commit by Build. R8 is the slow part, so it is not repeated here.
      - name: Wait for the signed build
        id: signed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA::7}"
          echo "short_sha=$short" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 40); do
            run_id=$(gh run list --workflow build.yml --commit "$HEAD_SHA" --limit 20 \
              --json databaseId,conclusion,event \
              --jq '[.[] | select((.event=="workflow_dispatch" or .event=="pull_request") and .conclusion=="success")][0].databaseId')
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            failed=$(gh run list --workflow build.yml --commit "$HEAD_SHA" --limit 20 \
              --json conclusion,event \
              --jq '[.[] | select((.event=="workflow_dispatch" or .event=="pull_request") and .conclusion=="failure")] | length')
            if [ "$failed" != "0" ]; then
              echo "::error::The signed build for $HEAD_SHA failed"
              exit 1
            fi
            echo "Signed build for $HEAD_SHA is not ready (attempt $attempt)"
            sleep 15
          done
          echo "::error::Timed out waiting for the signed build of $HEAD_SHA"
          exit 1

      - uses: actions/download-artifact@v7
        with:
          name: doit-release-${{ steps.signed.outputs.short_sha }}
          run-id: ${{ steps.signed.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check the APK is signed with the marinecircuits key
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mv "doit-release-${{ steps.signed.outputs.short_sha }}.apk" "doit-$VERSION.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "doit-$VERSION.apk" | tee signer.txt
          grep -q "SHA-256 digest: 064157c95274c36e68ee488d4102616aba074e847c3ff2ed63ed1a92c5400b09" signer.txt

      - name: Tag tested merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Release notes
        run: cz changelog "$VERSION" --dry-run > release_notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --title "Release $VERSION" \
              --notes-file release_notes.md --verify-tag
          fi
          gh release upload "$VERSION" "doit-$VERSION.apk" --clobber
