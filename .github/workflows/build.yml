name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs also build and verify a signed release APK, without tagging or publishing anything.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and debug APK
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

      - name: Name the APK and show its badging
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "doit-debug-$SHORT_SHA.apk"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump badging "doit-debug-$SHORT_SHA.apk" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion):"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "doit-debug-$SHORT_SHA.apk" \
            | grep -E "allowBackup|dataExtractionRules|networkSecurityConfig|fullBackupContent"

      - uses: actions/upload-artifact@v7
        with:
          name: doit-debug-${{ env.SHORT_SHA }}
          path: doit-debug-${{ env.SHORT_SHA }}.apk
          if-no-files-found: error

      - name: Check the Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::warning::Room schema changed; commit the files from the room-schemas artifact"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Organization secret ANDROID_SIGNING_KEYSTORE_BASE64 is not available to this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease

      - name: Check the APK is signed with the marinecircuits key
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "doit-release-$SHORT_SHA.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "doit-release-$SHORT_SHA.apk" | tee signer.txt
          grep -q "SHA-256 digest: 064157c95274c36e68ee488d4102616aba074e847c3ff2ed63ed1a92c5400b09" signer.txt
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: doit-release-${{ env.SHORT_SHA }}
          path: doit-release-${{ env.SHORT_SHA }}.apk
          if-no-files-found: error
