name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and debug APK
        run: ./gradlew --stacktrace testDebugUnitTest assembleDebug

      - name: Name the APK and show its badging
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "doit-debug-$SHORT_SHA.apk"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump badging "doit-debug-$SHORT_SHA.apk" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion):"

      - uses: actions/upload-artifact@v7
        with:
          name: doit-debug-${{ env.SHORT_SHA }}
          path: doit-debug-${{ env.SHORT_SHA }}.apk
          if-no-files-found: error

      - name: Check the Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::warning::Room schema changed; commit the files from the room-schemas artifact"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
